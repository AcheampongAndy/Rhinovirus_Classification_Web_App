<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload FASTA File</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="text-center">
            <h1 class="text-primary">Upload a FASTA File</h1>
            <p class="text-muted">Upload your FASTA file for analysis and view its content preview below.</p>
        </div>

        <!-- Display flash messages for errors or success -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert alert-info">
                    {% for message in messages %}
                        <p>{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <!-- Form for uploading a file -->
        <form action="{{ url_for('pipeline.upload') }}" method="post" enctype="multipart/form-data" class="shadow p-4 rounded bg-white">
            <div class="mb-3">
                <label for="file" class="form-label text-secondary">Select FASTA File:</label>
                <input type="file" name="file" id="file" class="form-control" required accept=".fasta">
            </div>

            <!-- Display file content preview -->
            <div class="mb-3">
                <label for="file-content" class="form-label text-secondary">Preview of the uploaded file:</label>
                <textarea id="file-content" class="form-control bg-light text-dark" rows="10" readonly></textarea>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-primary btn-lg">Upload and Analyze</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='preview.js') }}"></script>
</body>
</html>
