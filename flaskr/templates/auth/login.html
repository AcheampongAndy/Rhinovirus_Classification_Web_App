<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login - RhinoGen</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='auth_styles.css') }}">
    </head>
    <body>
        <div class="auth-container">
            <div class="auth-card">
                <h1>Log In</h1>
                <p>Welcome back! Please log in to continue.</p>
                <form method="post">
                    <label for="username">Username</label>
                    <input name="username" id="username" placeholder="Enter your username" required>
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" placeholder="Enter your password" required>
                    <button type="submit">Log In</button>
                </form>
                <p class="switch-auth">Don't have an account? <a href="{{ url_for('auth.register') }}">Sign Up</a></p>
            </div>
        </div>
    </body>
</html>
