<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Register - RhinoGen</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='auth_styles.css') }}">
    </head>
    <body>
        <div class="auth-container">
            <div class="auth-card">
                <h1>Sign Up</h1>
                <p>Join RhinoGen today to start analyzing Rhinovirus sequences.</p>
                <form method="post">
                    <label for="username">Username</label>
                    <input name="username" id="username" placeholder="Create a username" required>
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" placeholder="Create a password" required>
                    <button type="submit">Register</button>
                </form>
                <p class="switch-auth">Already have an account? <a href="{{ url_for('auth.login') }}">Log In</a></p>
            </div>
        </div>
    </body>
</html>
